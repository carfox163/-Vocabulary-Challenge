            text-align: center;
            word-break: break-word;

        function setFileStatus(text, isError) {
            const el = document.getElementById('fileStatus');
            if (!el) return;
            el.innerHTML = text;
            el.className = isError ? 'err' : '';
        }

        function parseWorkbook(data) {
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            return XLSX.utils.sheet_to_json(worksheet);
        }

        function applyWords(rows, label, fileName) {
            // 英文、中文为必须字段；音标、英文例句、例句汉译为可选字段
            wordsData = (rows || []).filter(w => w && w['英文'] && w['中文']);
            updateRemainingWords();
            setFileStatus(`（${label}：<span style="color:#e74c3c;font-weight:bold;">${wordsData.length}</span> 词${fileName ? `，来自“${fileName}”` : ''}）`);
            return wordsData.length;
        }

        function base64ToArray(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        // 页面打开时自动装入默认词库；用户随时可用文件框换成自己的词表
        async function loadDefaultWords() {
            setFileStatus('（正在加载默认词库…）');
            // 1) 优先读取与网页同目录下的同名 xlsx（方便日后直接替换词库文件）
            try {
                if (location.protocol !== 'file:') {
                    const res = await fetch('./' + encodeURIComponent(DEFAULT_WORD_FILE));
                    if (res.ok) {
                        const buf = await res.arrayBuffer();
                        const n = applyWords(parseWorkbook(new Uint8Array(buf)), '默认词库已加载', DEFAULT_WORD_FILE);
                        if (n > 0) return;
                    }
                }
            } catch (e) { /* 读不到就走下面的内置词库 */ }

            // 2) 回退：使用页面里内置的同一份 xlsx（BASE64）
            try {
                const n = applyWords(parseWorkbook(base64ToArray(DEFAULT_WORD_B64)), '默认词库已加载', DEFAULT_WORD_FILE);
                if (!n) setFileStatus('（默认词库为空，请手动选择文件）', true);
            } catch (error) {
                console.error(error);
                setFileStatus('（默认词库加载失败，请手动选择文件）', true);
            }
        }

        // 初始化设置
        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('gameTime').addEventListener('change', updateGameTime);
        document.getElementById('optionsCount').addEventListener('change', updateOptionsCount);
        document.getElementById('saveBtn').addEventListener('click', saveResults);
        document.getElementById('difficultyBtn').addEventListener('click', toggleDifficulty);
        document.getElementById('soundToggle').addEventListener('click', toggleSound);
        document.getElementById('downloadTemplate').addEventListener('click', downloadTemplate);
        document.getElementById('groupsSelector').addEventListener('click', toggleGroupsCount);
        document.getElementById('reviewBtn').addEventListener('click', startReview); // 新增复习按钮事件

        // 模式选择
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                gameMode = this.dataset.mode;
            });
        });

        function updateGameTime() {
            const newTime = parseInt(document.getElementById('gameTime').value);
            if (!isNaN(newTime) && newTime >= 10 && newTime <= 600) {
                timeLeft = newTime;
                const timerElement = document.getElementById('timer');
                if (timerElement) {
                    timerElement.textContent = `计时：${timeLeft}`;
                }
            }
        }

        function updateOptionsCount() {
            optionsCount = parseInt(document.getElementById('optionsCount').value);
        }

        function toggleDifficulty() {
            const difficulties = ['easy', 'normal', 'hard'];
            const currentIndex = difficulties.indexOf(difficulty);
            const nextIndex = (currentIndex + 1) % difficulties.length;
            difficulty = difficulties[nextIndex];

            const btn = document.getElementById('difficultyBtn');
            switch (difficulty) {
                case 'easy':
                    btn.textContent = '难度: 简单';
                    btn.style.background = '#00b894';
                    break;
                case 'normal':
                    btn.textContent = '难度: 普通';
                    btn.style.background = '#0984e3';
                    break;
                case 'hard':
                    btn.textContent = '难度: 困难';
                    btn.style.background = '#d63031';
                    break;
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            if (soundEnabled) {
                btn.textContent = '音效: 开';
                btn.classList.remove('off');
            } else {
                btn.textContent = '音效: 关';
                btn.classList.add('off');
            }
        }

        function toggleGroupsCount() {
            groupsCount = groupsCount % 3 + 1; // 循环1-3
            const btn = document.getElementById('groupsSelector');
            btn.textContent = `分组: ${groupsCount}组`;

            // 显示/隐藏分组
            document.getElementById('groupA').style.display = groupsCount >= 1 ? 'block' : 'none';
            document.getElementById('groupB').style.display = groupsCount >= 2 ? 'block' : 'none';
            document.getElementById('groupC').style.display = groupsCount >= 3 ? 'block' : 'none';

            // 重置每个分组的状态
            if (groupsCount < 3) {
                usedWords.C = [];
                results.C = { correct: 0, wrong: 0 };
                const remainingC = document.getElementById('remainingC');
                if (remainingC) {
                    remainingC.textContent = wordsData.length;
                }
                const resultC = document.getElementById('resultC');
                if (resultC) {
                    resultC.innerHTML = '';
                }
            }
            if (groupsCount < 2) {
                usedWords.B = [];
                results.B = { correct: 0, wrong: 0 };
                const remainingB = document.getElementById('remainingB');
                if (remainingB) {
                    remainingB.textContent = wordsData.length;
                }
                const resultB = document.getElementById('resultB');
                if (resultB) {
                    resultB.innerHTML = '';
                }
            }

            // 调整挑战容器布局
            const gameContainer = document.getElementById('gameContainer');
            if (groupsCount === 1) {
                gameContainer.style.justifyContent = 'center';
                const groupA = document.getElementById('groupA');
                if (groupA) {
                    groupA.style.width = '70%';
                }
                // 分组为1组时显示"查看答案"按钮
                const showAnswerBtn = document.getElementById('showAnswerA');
                if (showAnswerBtn) {
                    showAnswerBtn.style.display = 'block';
                }
                // 分组为1组时按钮文字改为"复习上一个"/"下一个"
                const prevBtnA = document.querySelector('#groupA .prev-btn');
                if (prevBtnA) {
                    prevBtnA.textContent = '复习上一个';
                }
                const nextBtnA = document.querySelector('#groupA .next-btn');
                if (nextBtnA) {
                    nextBtnA.textContent = '下一个';
                }
                // 分组为1组时标题显示单人模式
                const mainTitle1 = document.querySelector('.main-title');
                if (mainTitle1) {
                    mainTitle1.textContent = 'Vocabulary Challenge (单人模式)';
                }
            } else {
                gameContainer.style.justifyContent = 'space-around';
                const groupA = document.getElementById('groupA');
                if (groupA) {
                    groupA.style.width = '45%';
                }
                const groupB = document.getElementById('groupB');
                if (groupB) {
                    groupB.style.width = '45%';
                }
                const groupC = document.getElementById('groupC');
                if (groupC) {
                    groupC.style.width = '45%';
                }
                // 非1组时隐藏"查看答案"按钮
                const showAnswerBtn = document.getElementById('showAnswerA');
                if (showAnswerBtn) {
                    showAnswerBtn.style.display = 'none';
                }
                // 非1组时恢复按钮文字
                document.querySelectorAll('.prev-btn').forEach(btn => btn.textContent = '←');
                document.querySelectorAll('.next-btn').forEach(btn => btn.textContent = '→');
                // 分组为2组/3组时标题显示对战/比赛
                const mainTitle2 = document.querySelector('.main-title');
                if (mainTitle2) {
                    mainTitle2.textContent = groupsCount === 2 ? 'Vocabulary Challenge (双人对战)' : 'Vocabulary Challenge (三组比赛)';
                }
            }
        }

        // 下载单词表DIY模板：直接下载内置的模板文件
        function downloadTemplate() {
            const bin = atob(DIY_TEMPLATE_B64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '单词表模板.xlsx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const rows = parseWorkbook(data);
                    applyWords(rows, '当前文件已加载', file.name);
                } catch (error) {
                    alert('文件读取失败，请确保上传的是有效的Excel文件');
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function startGame() {
            if (!wordsData.length) return alert('请先上传单词文件');

            // 重置挑战状态
            timeLeft = parseInt(document.getElementById('gameTime').value) || 30;
            results = {
                A: { correct: 0, wrong: 0 },
                B: { correct: 0, wrong: 0 },
                C: { correct: 0, wrong: 0 }
            };
            usedWords = { A: [], B: [], C: [] }; // 重置已使用单词列表
            wordStatus = {}; // 重置单词回答状态
            currentQuestionIndex = { A: -1, B: -1, C: -1 }; // 重置问题索引

            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.style.display = 'inline-block';
                timerElement.textContent = `计时：${timeLeft}`;
            }

            // 根据难度设置计时器速度
            let timerSpeed = 1000; // 默认1秒
            if (difficulty === 'easy') timerSpeed = 1500; // 简单模式1.5秒
            if (difficulty === 'hard') timerSpeed = 700; // 困难模式0.7秒

            // 清除之前的计时器
            if (timer) clearInterval(timer);

            timer = setInterval(() => {
                timeLeft--;
                const timerElement = document.getElementById('timer');
                if (timerElement) {
                    timerElement.textContent = `计时：${timeLeft}`;
                }
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    showResults();
                }
            }, timerSpeed);

            // 根据选择的分组数量生成问题
            if (groupsCount >= 1) generateNewQuestion('A');
            if (groupsCount >= 2) generateNewQuestion('B');
            if (groupsCount >= 3) generateNewQuestion('C');
        }

        function setupQuestion(group, word) {
            const wordBox = document.getElementById(`word${group}`);
            const bubbles = document.getElementById(`bubbles${group}`);

            let question, correctAnswer;
            const count = parseInt(document.getElementById('optionsCount').value) || 4;

            switch (gameMode) {
                case 'en-cn': // 英译中
                    question = word.英文.toLowerCase();
                    correctAnswer = word.中文;
                    if (wordBox) {
                        wordBox.textContent = question;
                    }
                    generateOptions(group, correctAnswer, '中文', count);
                    break;

                case 'cn-en': // 中译英
                    question = word.中文;
                    correctAnswer = word.英文.toLowerCase();
                    if (wordBox) {
                        wordBox.textContent = question;
                    }
                    generateOptions(group, correctAnswer, '英文', count);
                    break;

                case 'spelling': // 拼写测试
                    question = word.中文;
                    correctAnswer = word.英文.toLowerCase();
                    if (wordBox) {
                        wordBox.textContent = `拼写: ${question}`;
                    }
                    generateOptions(group, correctAnswer, '英文', count);
                    break;
            }

            // 仅修改一处：分组为1组时，无论英→中、中→英、拼写测试模式，每个单词均自动发音，无需点击
            if (groupsCount === 1) {
                playSound(question);
            }
        }

        function showAnswer(group) {
            if (!currentWords[group]) return;
            // 根据模式确定正确答案文本
            let correctText, answerLang;
            if (gameMode === 'en-cn') {
                correctText = currentWords[group].中文;
                answerLang = 'zh-CN';
            } else {
                correctText = currentWords[group].英文.toLowerCase();
                answerLang = 'en-US';
            }
            // 绿色高亮正确答案气泡
            document.querySelectorAll(`#bubbles${group} .bubble`).forEach(bubble => {
                if (bubble.textContent === correctText) {
                    bubble.classList.add('correct-highlight');
                }
            });
            // 1. 自动朗读正确答案：中文用 Microsoft Xiaoxiao，英文用 Microsoft Ryan
            speakAnswer(correctText, answerLang);
            // 2. 在答案下方显示典型例句 1-2 个
            showExampleSentences(group);
        }

        // 选取优先语音：中文优先 Microsoft Xiaoxiao，英文优先 Microsoft Ryan
        function pickPreferredVoice(lang) {
            const synth = window.speechSynthesis;
            const voices = synth.getVoices();
            const voiceKeyword = lang.startsWith('zh') ? 'xiaoxiao' : 'ryan';
            const langPrefix = lang.slice(0, 2);
            const preferred = voices.find(v =>
                v.name.toLowerCase().includes(voiceKeyword) && v.lang.toLowerCase().startsWith(langPrefix));
            if (preferred) return preferred;

        // 用优先语音朗读文本（语音列表未加载完成时自动等待）
        function speakWithPreferredVoice(text, lang) {
            if (!window.speechSynthesis) return;
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.volume = 1;
            const applyVoice = () => {
                const voice = pickPreferredVoice(lang);
                if (voice) utterance.voice = voice;
                synth.speak(utterance);
            };
            if (synth.getVoices().length) {
                applyVoice();
            } else {
                synth.onvoiceschanged = () => {
                    synth.onvoiceschanged = null;
                    applyVoice();
                };

            }
        }

        const POS_FULL = {
            'n.': 'noun',
            'v.': 'verb',
            'vt.': 'transitive verb',
            'vi.': 'intransitive verb',
            'adj.': 'adjective',
            'a.': 'adjective',
            'adv.': 'adverb',
            'ad.': 'adverb',
            'prep.': 'preposition',
            'conj.': 'conjunction',
            'pron.': 'pronoun',
            'num.': 'numeral',
            'art.': 'article',
            'aux.': 'auxiliary verb',
            'interj.': 'interjection',
            'int.': 'interjection',
            'abbr.': 'abbreviation',
            'pl.': 'plural',
            'sing.': 'singular',
            'phr.': 'phrase',

            'sth.': 'something',

        // 兼容写法：大小写（N./Vt.）、中英文点（. ． 。）、点后有无空格（n. 政策 / n.政策 / n．政策 / n。政策）、
        //           无点仅空格分隔（n 政策）、冒号分隔（n:政策 / n：政策）、连写多词性（n.&v. 打败、n./v. 打败）等
        function expandPosTags(text) {
            if (!text) return text;
            let t = text.replace(/\be\.g\.\s*/gi, 'for example ');
            return t.replace(/(^|[\s/&、,，;；])([a-zA-Z]+)(?:[.\．。:：][\s]*|[\s]+|$)/g, (m, pre, letters) => {
                const full = POS_FULL[letters.toLowerCase() + '.'];
                return full ? (pre.trim() ? pre + ' ' : '') + full + ' ' : m;
            });
        }

        // localStorage 例句缓存：自定义词表首次获取成功后长期可用
        const LOCAL_EXAMPLES_KEY = 'vocabularyExampleCache';

        function loadLocalExamples() {
            try { return JSON.parse(localStorage.getItem(LOCAL_EXAMPLES_KEY)) || {}; }
            catch (e) { return {}; }
        }

        function saveLocalExamples(map) {
            try { localStorage.setItem(LOCAL_EXAMPLES_KEY, JSON.stringify(map)); } catch (e) {}
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 带超时的 fetch，避免请求长时间挂起
        function fetchWithTimeout(url, ms) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), ms);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function splitLines(s) {
            return (s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
        }

        // 词库自带 音标/英文例句/例句汉译 时，渲染音标与双语例句
        function renderWordbookInfo(box, word) {
            let html = '';
            if (word.音标) {
                html += `<div class="example-phonetic">音标：${escapeHtml(word.音标)}</div>`;
            }
            if (word.英文例句) {
                const engLines = splitLines(word.英文例句);
                const chnLines = splitLines(word.例句汉译);
                if (engLines.length) {
                    html += '<div class="example-title">例句：</div>';
                    engLines.slice(0, 2).forEach((eng, i) => {
                        const chn = chnLines[i];
                        html += `<div class="example-item"><button class="example-speaker" title="朗读例句及译文" data-en="${escapeHtml(eng)}" data-cn="${escapeHtml(chn || '')}" onclick="speakExample(this)">🔊</button>${escapeHtml(eng)}</div>`;
                        if (chn) {
                            html += `<div class="example-item example-cn">${escapeHtml(chn)}</div>`;
                        }
                    });
                }
            }
            box.innerHTML = html || '<div class="example-title">例句：</div><div class="example-item">未找到该单词的典型例句</div>';
        }

        function renderExamples(box, examples) {
            box.innerHTML = '<div class="example-title">例句：</div>' +
                examples.map(e => `<div class="example-item"><button class="example-speaker" title="朗读例句" data-en="${escapeHtml(e)}" data-cn="" onclick="speakExample(this)">🔊</button>${escapeHtml(e)}</div>`).join('');
        }

        // 朗读例句及译文：英文优先 Microsoft Ryan，中文优先 Microsoft Xiaoxiao（按顺序播放）
        function speakExample(btn) {
            const en = (btn.dataset.en || '').trim();
            const cn = (btn.dataset.cn || '').trim();
            if (en) speakWithPreferredVoice(en, 'en-US');
            if (cn) speakWithPreferredVoice(cn, 'zh-CN');
        }

        async function showExampleSentences(group) {
            const box = document.getElementById(`example${group}`);
            if (!box || !currentWords[group]) return;
            const word = currentWords[group].英文;
            if (!word) return;

            // 0) 词库自带 音标/英文例句 时，优先用词库数据（仅单人模式，查看答案后显示音标与双语例句）
            if (groupsCount === 1 && (currentWords[group].音标 || currentWords[group].英文例句)) {
                renderWordbookInfo(box, currentWords[group]);
                return;
            }

            // 1) 内置例句库（默认425词，离线立即可用）
            if (DEFAULT_EXAMPLES[word]) {
                renderExamples(box, DEFAULT_EXAMPLES[word]);
                return;
            }
            // 2) 本地缓存（自定义词表首次成功后长期可用）
            const localMap = loadLocalExamples();
            if (localMap[word]) {
                renderExamples(box, localMap[word]);
                return;
            }

            box.innerHTML = '<div class="example-title">例句：</div><div class="example-item">正在加载…</div>';

            const failHtml = '<div class="example-title">例句：</div>' +

                '<div class="example-item"><button class="example-retry" onclick="showExampleSentences(\'A\')">重试</button></div>';
            const notFoundHtml = '<div class="example-title">例句：</div><div class="example-item">未找到该单词的典型例句</div>';

                try {

                    if (res.status === 404) {
                        // 词典中确实没有该词，无需重试
                        box.innerHTML = notFoundHtml;
                        return;
                    }
                    if (!res.ok) {

                        box.innerHTML = failHtml;
                        return;
                    }
                    const data = await res.json();
                    const examples = [];

                        (m.definitions || []).forEach(d => {
                            if (d.example && examples.length < 2) examples.push(d.example);

                        return;
                    }
                    // 成功后写入本地缓存，之后不再依赖网络
                    localMap[word] = examples;
                    saveLocalExamples(localMap);
                    renderExamples(box, examples);
                    return;
                } catch (err) {
                    // 网络/超时异常，稍后自动重试
                    if (attempt < 3) { await sleep(600 * attempt); continue; }
                    box.innerHTML = failHtml;
                }
            }
        }

        function generateNewQuestion(group) {
            const availableWords = wordsData.filter(word => !usedWords[group].includes(word));
            if (!availableWords.length) {
                alert(`该组已无剩余单词`);
                const nextBtn = document.querySelector(`#group${group} .next-btn`);
                if (nextBtn) {
                    nextBtn.disabled = true;
                }
                return;
            }

            const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
            currentWords[group] = randomWord;
            usedWords[group].push(randomWord); // 标记该单词已使用
            currentQuestionIndex[group] = usedWords[group].length - 1;

            setupQuestion(group, randomWord);
            updateRemainingWords();
            const nextBtn = document.querySelector(`#group${group} .next-btn`);
            if (nextBtn) {
                nextBtn.disabled = false;
            }
        }

        function generateOptions(group, correctAnswer, field, count) {
            const options = [correctAnswer];

            if (gameMode === 'spelling') {
                // 生成形近词或拼写易混词作为干扰项
                while (options.length < count) {
                    const similarWord = generateSimilarWord(correctAnswer);
                    if (!options.includes(similarWord) && similarWord!== correctAnswer) {
                        options.push(similarWord);
                    }
                }
            } else {
                // 生成干扰项
                while (options.length < count) {
                    const randomWord = wordsData[Math.floor(Math.random() * wordsData.length)];
                    const randomOption = randomWord[field].toLowerCase();

                    // 确保干扰项不重复且不与正确答案相同
                    if (!options.includes(randomOption) && randomOption!== correctAnswer) {
                        options.push(randomOption);
                    }
                }
            }

            // 随机排序选项
            options.sort(() => Math.random() - 0.5);

            // 清空并重新生成气泡选项
            const bubbles = document.getElementById(`bubbles${group}`);
            if (bubbles) {
                bubbles.innerHTML = '';
            }

            // 换题时同步清空例句框
            const exampleBox = document.getElementById(`example${group}`);
            if (exampleBox) {
                exampleBox.innerHTML = '';
            }

            options.forEach(option => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = option;
                bubble.onclick = (e) => checkAnswer(group, option, e);
                if (bubbles) {
                    bubbles.appendChild(bubble);
                }
            });
        }

        function generateSimilarWord(word) {
            const index = Math.floor(Math.random() * word.length);
            const alphabet = 'abcdefghijklmnopqrstuvwxyz';
            const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            return word.slice(0, index) + randomChar + word.slice(index + 1);
        }

        function checkAnswer(group, selected, e) {
            if (!currentWords[group]) return;

            let isCorrect = false;
            const correctSound = document.querySelector('.correct-sound');
            const wrongSound = document.querySelector('.wrong-sound');

            // 根据挑战模式判断答案是否正确
            switch (gameMode) {
                case 'en-cn':
                    isCorrect = selected === currentWords[group].中文;
                    break;
                case 'cn-en':
                case 'spelling':
                    isCorrect = selected.toLowerCase() === currentWords[group].英文.toLowerCase();
                    break;
            }

            if (isCorrect) {
                results[group].correct++;
                wordStatus[currentWords[group].英文] = true; // 标记为回答正确
                if (soundEnabled) {
                    if (correctSound) {
                        correctSound.currentTime = 0;
                        correctSound.play();
                    }
                }
                generateNewQuestion(group);
                updateRemainingWords();
            } else {
                results[group].wrong++;
                wordStatus[currentWords[group].英文] = false; // 标记为回答错误
                if (soundEnabled) {
                    if (wrongSound) {
                        wrongSound.currentTime = 0;
                        wrongSound.play();
                    }
                }
                if (e.target) {
                    e.target.style.background = '#dfe6e9';
                    e.target.style.borderColor = '#b2bec3';
                    e.target.style.animation = 'none';
                }

                // 困难模式下答错会减少时间
                if (difficulty === 'hard') {
                    timeLeft = Math.max(1, timeLeft - 2);
                    const timerElement = document.getElementById('timer');
                    if (timerElement) {
                        timerElement.textContent = `计时：${timeLeft}`;
                    }
                }
            }
        }

        function showResults() {
            if (groupsCount >= 1) {
                const resultA = document.getElementById('resultA');
                if (resultA) {
                    resultA.innerHTML = `
                        🎉 正确：${results.A.correct} &nbsp;&nbsp; ❌ 错误：${results.A.wrong}
                    `;
                }
            }
            if (groupsCount >= 2) {
                const resultB = document.getElementById('resultB');
                if (resultB) {
                    resultB.innerHTML = `
                        🎉 正确：${results.B.correct} &nbsp;&nbsp; ❌ 错误：${results.B.wrong}
                    `;
                }
            }
            if (groupsCount >= 3) {
                const resultC = document.getElementById('resultC');
                if (resultC) {
                    resultC.innerHTML = `
                        🎉 正确：${results.C.correct} &nbsp;&nbsp; ❌ 错误：${results.C.wrong}
                    `;
                }
            }

            // 保存结果到历史记录
            saveToHistory();
        }

        function saveToHistory() {
            const timestamp = new Date().toISOString();
            const totalA = results.A.correct + results.A.wrong;
            const totalB = results.B.correct + results.B.wrong;
            const totalC = results.C.correct + results.C.wrong;
            const accuracyA = totalA > 0 ? Math.round((results.A.correct / totalA) * 100) : 0;
            const accuracyB = totalB > 0 ? Math.round((results.B.correct / totalB) * 100) : 0;
            const accuracyC = totalC > 0 ? Math.round((results.C.correct / totalC) * 100) : 0;

            gameHistory.push({
                timestamp,
                mode: gameMode,
                difficulty,
                timeLimit: parseInt(document.getElementById('gameTime').value) || 30,
                groupsCount,
                groupA: { ...results.A, total: totalA, accuracy: accuracyA },
                groupB: { ...results.B, total: totalB, accuracy: accuracyB },
                groupC: { ...results.C, total: totalC, accuracy: accuracyC },
                wordStatus
            });

            // 只保留最近的50条记录
            if (gameHistory.length > 50) {
                gameHistory = gameHistory.slice(-50);
            }

            localStorage.setItem('vocabularyGameHistory', JSON.stringify(gameHistory));
        }

        function saveResults() {
            // 检查是否有可保存的成绩
            let hasResults = false;
            for (let i = 1; i <= groupsCount; i++) {
                const group = String.fromCharCode(64 + i);
                if (results[group].correct > 0 || results[group].wrong > 0) {
                    hasResults = true;
                    break;
                }
            }

            if (!hasResults) return alert('没有可保存的成绩记录');

            // 统一使用逗号作为分隔符
            const separator = ',';

            // 创建CSV内容，解决中文乱码问题
            let csvContent = "\uFEFF"; // 添加BOM头解决中文乱码
            csvContent += `数据${separator}组A${separator}组B${separator}组C\n`;
            csvContent += `正确${separator}${results.A.correct}${separator}${results.B.correct}${separator}${results.C.correct}\n`;
            csvContent += `错误${separator}${results.A.wrong}${separator}${results.B.wrong}${separator}${results.C.wrong}\n`;

            const totalA = results.A.correct + results.A.wrong;
            const totalB = results.B.correct + results.B.wrong;
            const totalC = results.C.correct + results.C.wrong;
            const accuracyA = totalA > 0 ? Math.round((results.A.correct / totalA) * 100) : 0;
            const accuracyB = totalB > 0 ? Math.round((results.B.correct / totalB) * 100) : 0;
            const accuracyC = totalC > 0 ? Math.round((results.C.correct / totalC) * 100) : 0;

            csvContent += `总计${separator}${totalA}${separator}${totalB}${separator}${totalC}\n`;
            csvContent += `正确率${separator}${accuracyA}%${separator}${accuracyB}%${separator}${accuracyC}%\n`;
            csvContent += `挑战模式${separator}${getModeName(gameMode)}\n`;
            csvContent += `难度${separator}${getDifficultyName(difficulty)}\n`;
            csvContent += `分组数量${separator}${groupsCount}\n`;
            csvContent += `时间限制${separator}${parseInt(document.getElementById('gameTime').value) || 30}`;

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            if (link.download!== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', '成绩记录.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function getModeName(mode) {
            switch (mode) {
                case 'en-cn':
                    return '英→中';
                case 'cn-en':
                    return '中→英';
                case 'spelling':
                    return '拼写测试';
                default:
                    return '未知模式';
            }
        }

        function getDifficultyName(difficulty) {
            switch (difficulty) {
                case 'easy':
                    return '简单';
                case 'normal':
                    return '普通';
                case 'hard':
                    return '困难';
                default:
                    return '未知难度';
            }
        }

        function updateRemainingWords() {
            if (groupsCount >= 1) {
                const remainingA = document.getElementById('remainingA');
                if (remainingA) {
                    remainingA.textContent = wordsData.length - usedWords.A.length;
                }
            }
            if (groupsCount >= 2) {
                const remainingB = document.getElementById('remainingB');
                if (remainingB) {
                    remainingB.textContent = wordsData.length - usedWords.B.length;
                }
            }
            if (groupsCount >= 3) {
                const remainingC = document.getElementById('remainingC');
                if (remainingC) {
                    remainingC.textContent = wordsData.length - usedWords.C.length;
                }
            }
        }

        function prevQuestion(group) {
            if (currentQuestionIndex[group] > 0) {
                currentQuestionIndex[group]--;
                const prevWord = usedWords[group][currentQuestionIndex[group]];
                currentWords[group] = prevWord;
                setupQuestion(group, prevWord);
                const prevBtn = document.querySelector(`#group${group} .prev-btn`);
                if (prevBtn) {
                    prevBtn.disabled = false;
                }
                const nextBtn = document.querySelector(`#group${group} .next-btn`);
                if (nextBtn) {
                    nextBtn.disabled = false;
                }
            } else {
                alert('已经是第一个问题了');
                const prevBtn = document.querySelector(`#group${group} .prev-btn`);
                if (prevBtn) {
                    prevBtn.disabled = true;
                }
            }
        }

        function nextQuestion(group) {
            generateNewQuestion(group);
        }

        function resetGame() {
            // 重置挑战状态
            timeLeft = parseInt(document.getElementById('gameTime').value) || 30;
            results = {
                A: { correct: 0, wrong: 0 },
                B: { correct: 0, wrong: 0 },
                C: { correct: 0, wrong: 0 }
            };
            usedWords = { A: [], B: [], C: [] }; // 重置已使用单词列表
            wordStatus = {}; // 重置单词回答状态
            currentQuestionIndex = { A: -1, B: -1, C: -1 }; // 重置问题索引

            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.textContent = `计时：${timeLeft}`;
            }

            const resultA = document.getElementById('resultA');
            if (resultA) {
                resultA.innerHTML = '';
            }
            const resultB = document.getElementById('resultB');
            if (resultB) {
                resultB.innerHTML = '';
            }
            const resultC = document.getElementById('resultC');
            if (resultC) {
                resultC.innerHTML = '';
            }

            updateRemainingWords();
        }

        function startReview() {
            if (!wordsData.length) return alert('请先上传单词文件');

            // 创建新窗口
            const reviewWindow = window.open('', '_blank');
            if (reviewWindow) {
                // 生成复习页面内容
                let reviewContent = '<html><head><title>单词复习</title><style>';
                reviewContent += '.correct { background-color: rgba(144, 238, 144, 0.5); }';
                reviewContent += '.wrong { background-color: rgba(255, 192, 203, 0.5); }';
                reviewContent += '</style></head><body>';

                wordsData.forEach(word => {
                    const status = wordStatus[word.英文];
                    const className = status === true? 'correct' : 'wrong';
                    reviewContent += `<p class="${className}">${word.英文} - ${word.中文}</p>`;
                });

                reviewContent += '</body></html>';

                // 将内容写入新窗口
                reviewWindow.document.write(reviewContent);
                reviewWindow.document.close();
            }
        }

function playSound(word) {
    const synth = window.speechSynthesis;
    let textToSpeak = word;

    if (gameMode === 'cn-en' || gameMode === 'spelling') {
        // 提取中文内容，去除词性等非中文内容
        textToSpeak = textToSpeak.replace(/[a-zA-Z. ]+/g, '');
        // 中文发音优先使用 Microsoft Xiaoxiao 语音
        speakWithPreferredVoice(textToSpeak, 'zh-CN');
    } else if (gameMode === 'en-cn' || gameMode === 'spelling') {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        synth.speak(utterance);
    }
}

        // 页面打开后自动装入默认词库（未选择文件时生效）
        loadDefaultWords();

    </script>
